<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#fff7f4">
		<meta name="description" content="Um convite especial para a Sophia.">
		<title>Um convite para Sophia</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
		<script src="script.js" defer></script>
	</head>
	<body class="invite-page">
		<main class="invite-layout" id="invite">
			<section class="invite-copy" aria-labelledby="invite-title">
				<div class="tiny-bow" aria-hidden="true"><span></span><span></span><i></i></div>
				<p class="eyebrow">um convite feito com carinho</p>
				<h1 id="invite-title">Sophia,<br>topa um<br><span>sorvetinho</span><br>comigo?</h1>
				<p class="invite-note">Prometo um sorvete gostoso e uma tarde bem leve. ♡</p>
				<div class="invite-actions">
					<a class="button button-primary" href="agenda.html">Sim, eu topo! <span aria-hidden="true">♡</span></a>
					<button class="button button-quiet" id="no-thanks" type="button">Hoje não</button>
				</div>
				<p class="no-response" id="no-response" aria-live="polite" hidden>Sem problema, de verdade. Obrigado por responder com carinho ♡</p>
				<p class="signature">feito especialmente pra você <span aria-hidden="true">✿</span></p>
			</section>

			<section class="invite-art" aria-label="Fotos de sorvetes e ilustrações fofas">
				<div class="art-sticker sticker-heart" aria-hidden="true">♡</div>
				<div class="art-sticker sticker-sparkle" aria-hidden="true">✳</div>
				<div class="photo-frame" id="ice-cream-carousel" role="region" aria-roledescription="carrossel" aria-label="Fotos de sorvete">
					<div class="carousel-slides">
						<figure class="carousel-slide is-active" aria-hidden="false" aria-label="1 de 3">
							<img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=1100&q=85" alt="Sobremesa de sorvete com calda de chocolate" fetchpriority="high">
							<figcaption class="photo-caption">uma pausa bem docinha</figcaption>
						</figure>
						<figure class="carousel-slide" aria-hidden="true" aria-label="2 de 3">
							<img src="https://images.unsplash.com/photo-1488900128323-21503983a07e?auto=format&fit=crop&w=1100&q=85" alt="Picolés de frutas vermelhas">
							<figcaption class="photo-caption">um sabor pra cada vontade</figcaption>
						</figure>
						<figure class="carousel-slide" aria-hidden="true" aria-label="3 de 3">
							<img src="https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=1100&q=85" alt="Sorvete servido em casquinha">
							<figcaption class="photo-caption">o passeio perfeito ♡</figcaption>
						</figure>
					</div>
					<button class="carousel-arrow carousel-prev" type="button" aria-label="Foto anterior">‹</button>
					<button class="carousel-arrow carousel-next" type="button" aria-label="Próxima foto">›</button>
					<div class="carousel-dots" aria-label="Escolher foto">
						<button type="button" class="carousel-dot is-active" aria-label="Mostrar foto 1" aria-pressed="true"></button>
						<button type="button" class="carousel-dot" aria-label="Mostrar foto 2" aria-pressed="false"></button>
						<button type="button" class="carousel-dot" aria-label="Mostrar foto 3" aria-pressed="false"></button>
					</div>
				</div>
				<div class="mascot mascot-kitty" aria-hidden="true">
					<span class="mascot-ear mascot-ear-left"></span><span class="mascot-ear mascot-ear-right"></span>
					<span class="mascot-bow"></span>
					<span class="mascot-face"><i></i><i></i><b></b></span>
				</div>
				<div class="mascot mascot-puppy" aria-hidden="true">
					<span class="puppy-ear puppy-ear-left"></span><span class="puppy-ear puppy-ear-right"></span>
					<span class="mascot-face"><i></i><i></i><b></b></span>
				</div>
				<div class="cloud cloud-one" aria-hidden="true"></div>
				<div class="cloud cloud-two" aria-hidden="true"></div>
				<p class="art-note">🍓 + ☁️ + ♡</p>
			</section>
		</main>
	</body>
</html>
